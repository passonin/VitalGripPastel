</style></head><body><div id="connectPage" class="connectPage">
<h1>Vital Grip</h1> 
<div style="display:flex;
flex-direction:column;
align-items:center;">
 <button id="connectBtn" class="startBtn"><h1>START</h1></button>

</main>
<script>
let on=false,mode="off",one=0,left=0,right=6,play=0,count=0,pairs=[],pairNo=0,demoTimer=null,currentTask = [],makeNo=1,twoPlay=false,makePos=0,turn=0,sethold=null;
let taskSets = Array(12).fill(null).map(() => []);
let selectedTask = 0;
let playTask = [];
let playTurn = 0;
let selectSource = "";
let playReturnMode = "one";
let editTurn = 0;
let prevPlayHold = null;
let bleDevice=null;
let bleServer=null;
let bleService=null;
let bleCharacteristic=null;
let bleReceiveBuffer="";
let nextBusy=false;
let audioContext = null;
// 音量はスマホ本体の音量ボタンで調整。ESP32のブザーはVOL,0でミュート。
const PHONE_SOUND_GAIN = 0.055;

function getAudioContext(){
  if (audioContext) return audioContext;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) {
    console.warn("Web Audio API is not supported");
    return null;
  }
  audioContext = new AudioContextClass();
  return audioContext;
}

async function unlockPhoneAudio(){
  const ctx = getAudioContext();
  if (ctx && ctx.state === "suspended") {
    try { await ctx.resume(); }
    catch (err) { console.log("Audio resume error:", err); }
  }
}

// ESP32のパッシブブザーに近い矩形波音をスマホで再生する。
function playPhoneTone(freq, startTime, baseDurationMs, gainMultiplier = 1){
  const ctx = getAudioContext();
  if (!ctx) return;
  const duration = baseDurationMs / 1000;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  const toneGain = Math.min(0.95, PHONE_SOUND_GAIN * gainMultiplier);
  gain.gain.linearRampToValueAtTime(toneGain, startTime + 0.004);
  gain.gain.setValueAtTime(toneGain, Math.max(startTime + 0.005, startTime + duration - 0.008));
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.005);
}

function playPattern(notes, gainMultiplier = 1){
  const ctx = getAudioContext();
  if (!ctx) return;
  let t = ctx.currentTime + 0.015;
  for (const [freq, baseMs, gapMs] of notes){
    playPhoneTone(freq, t, baseMs, gainMultiplier);
    t += (baseMs + gapMs) / 1000;
  }
}

function playBLEOnSound(){
  playPattern([[2000,60,30],[3000,60,30],[4000,80,0]]);
}

function playPowerOnSound(){
  playPattern([[2000,60,30],[2500,60,30],[3000,80,0]]);
}

function playPlaySound(){
  playPattern([[2000,200,60],[3000,100,60]]);
}

function playNextWhistle(){
  playPattern([[4000,80,0]]);
}

function playPowerOffSound(){
  playPattern([[1500,60,20],[1000,100,0]]);
}

function playPlayEndSound(){
  playPattern([[4100,50,90],[4100,420,0]], 2);
}

function playClickSound(){
  const ctx = getAudioContext();
  if (!ctx) return;
  if (ctx.state === "suspended") {
    ctx.resume().catch(err => console.log("Audio resume error:", err));
  }

  const t = ctx.currentTime + 0.003;
  const level = PHONE_SOUND_GAIN * 0.72;

  // 短いノイズでアタックを作り、低めの音を重ねて乾いた「コッ」にする。
  const length = Math.floor(ctx.sampleRate * 0.012);
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) {
    const fade = 1 - i / length;
    samples[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const noise = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const noiseGain = ctx.createGain();
  noise.buffer = buffer;
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2600, t);
  noiseGain.gain.setValueAtTime(level * 0.42, t);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.010);
  noise.connect(filter).connect(noiseGain).connect(ctx.destination);
  noise.start(t);
  noise.stop(t + 0.012);

  const osc = ctx.createOscillator();
  const bodyGain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(760, t);
  osc.frequency.exponentialRampToValueAtTime(480, t + 0.025);
  bodyGain.gain.setValueAtTime(level, t);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.032);
  osc.connect(bodyGain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.035);
}

// BLE GATT write queue: TURNNEXTとHOLD通知の書き込みを直列化
let bleWriteQueue = Promise.resolve();

function enqueueBLEWrite(value, label="BLE WRITE") {
  const task = bleWriteQueue.then(async () => {
    if (!bleDevice || !bleDevice.gatt.connected || !bleCharacteristic) {
      return false;
    }
    try {
      await bleCharacteristic.writeValue(value);
      return true;
    } catch (err) {
      console.log(label + " error:", err);
      return false;
    }
  });

  // 1件が失敗しても、後続のBLE送信を止めない
  bleWriteQueue = task.then(() => undefined, () => undefined);
  return task;
}

//localStorage.removeItem("vitalTaskSets");

async function connectBLE(){try{
bleDevice=await navigator.bluetooth.requestDevice({
filters:[{namePrefix:"VitalGrip"}],
optionalServices:["0000dfb0-0000-1000-8000-00805f9b34fb"]});
bleServer=await bleDevice.gatt.connect();
bleService=await bleServer.getPrimaryService("0000dfb0-0000-1000-8000-00805f9b34fb");
bleCharacteristic=await bleService.getCharacteristic("0000dfb1-0000-1000-8000-00805f9b34fb");

await bleCharacteristic.startNotifications();bleCharacteristic.addEventListener(
  "characteristicvaluechanged",
  e=>{

    const s =
      new TextDecoder()
      .decode(e.target.value)
      .trim();

    console.log(
      "BLE RX:",
      s
    );

    if(
      s==="NEXT" &&
      mode==="play"
    ){
      nextTurn();
    }
  }
);
document.getElementById("connectStatus").textContent ="接続完了";
hint.textContent="電源を押して開始";
document.getElementById("connectPage").style.display="none";
document.getElementById("mainPage").style.display="flex";
// BLE接続完了音（スマホから再生）
await unlockPhoneAudio();
playBLEOnSound();
// 保存済み音量をESP32へ設定してから接続時のALLOFFを送る。
await sendLED("VOL,0");
await sendLED("ALLOFF");
bleDevice.addEventListener("gattserverdisconnected",()=>{
document.getElementById("connectPage").style.display="flex";
document.getElementById("mainPage").style.display="none";

document.getElementById("connectStatus").textContent =
  "切断されました";
bleCharacteristic=null;
bleService=null;
bleServer=null;
bleReceiveBuffer="";
hint.textContent="無線切断";});}catch(err){console.log(err);document.getElementById("connectStatus").textContent="接続失敗";}}
document.getElementById("connectBtn").onclick = async ()=>{
  document.getElementById("connectStatus").textContent = "接続中...";
  await unlockPhoneAudio();
  await connectBLE();
};

function onBleReceive(e){let s=new TextDecoder().decode(e.target.value).trim();console.log("BLE RX:",s);if(s==="NEXT")nextTurn();}

async function nextTurn(){

    if(nextBusy){
        console.log(
            "NEXT IGNORE"
        );
        return;
    }

    nextBusy=true;

    try {
        if (mode !== "play") return;

        // 最後のNEXTだけは通常の笛音ではなく、終了専用の「ピッ、ピーーー」を鳴らす。
        const isFinalTurn = (playTurn + 1 >= playTask.length);
        if (isFinalTurn) playPlayEndSound();
        else playNextWhistle();

        playTurn++;

        if (playTurn >= playTask.length) {
            h.forEach((_, i) => paint(i, null));
            prevPlayHold = null;
            await sendLED("ALLOFF");
            mode = playReturnMode;
            if (mode === "two") halves();
            else previewColor(one);
            update();
            return;
        }

        // 直前のHoldは点灯したまま残し、2つ前のHoldを消灯する。
        // 同じHold番号が直前または新しいHoldにも使われている場合は消灯しない。
        const newHold = playTask[playTurn];
        const keepHold = playTask[playTurn - 1];
        const offTurnIndex = playTurn - 2;
        let offHoldId = 0; // 0は消灯対象なし（最初のNEXT）

        if (offTurnIndex >= 0) {
            const candidateOffHold = playTask[offTurnIndex];
            if (candidateOffHold !== keepHold && candidateOffHold !== newHold) {
                paint(candidateOffHold, null);
                offHoldId = candidateOffHold + 1; // Hold番号は1～12
            }
        }

        paint(newHold, playColor(playTurn));
        await sendPlayTurn(playTurn, offHoldId);
        update();
    }

    finally{

        nextBusy=false;
    }
}

async function sendHold(no){
  return enqueueBLEWrite(new TextEncoder().encode(String(no)), "BLE HOLD TX");
}

async function sendLED(cmd){
  return enqueueBLEWrite(
    new TextEncoder().encode(cmd + "\n"),
    "BLE COMMAND TX " + cmd
  );
}

// PLAY開始時：最初のHoldだけを点灯する。
// playTaskは0始まり、ESP32/PICへのHold番号は1始まり。
async function sendPlayHold(turnIndex){
  if (turnIndex < 0 || turnIndex >= playTask.length) return false;
  const holdId = playTask[turnIndex] + 1;
  const color = playColor(turnIndex) + 1; // PIC SHOWは1～7
  return sendLED(`HOLD,${holdId},${color}`);
}

// PLAY中のTurn更新：新しいHoldを点灯し、必要なら2つ前のHoldを消灯する。
// 書式: TURN,<点灯Hold 1-12>,<色 1-7>,<消灯Hold 0-12>
// offHoldId=0 の場合は消灯せず、点灯だけ行う。
async function sendPlayTurn(turnIndex, offHoldId = 0){
  if (turnIndex < 1 || turnIndex >= playTask.length) return false;
  if (offHoldId < 0 || offHoldId > 12) return false;
  const holdId = playTask[turnIndex] + 1;
  const color = playColor(turnIndex) + 1;
  return sendLED(`TURN,${holdId},${color},${offHoldId}`);
}

async function sendLEDState(){
  if(mode==="off" || !bleCharacteristic || !bleDevice || !bleDevice.gatt.connected) return;

  const led = [];
  for(let i=0;i<12;i++){
    led[i] = h[i].classList.contains("lit") ? getHoldColor(i) + 1 : 0;
  }

  const data = new Uint8Array(5);
  let bitPos = 0;
  for(let i=0;i<12;i++){
    const v = led[i] & 0x07;
    const bytePos = Math.floor(bitPos / 8);
    const shift = bitPos % 8;
    data[bytePos] |= v << shift;
    if(shift > 5) data[bytePos + 1] |= v >> (8 - shift);
    bitPos += 3;
  }

  const sent = await enqueueBLEWrite(data, "LED STATE TX");
  if(sent){
    console.log("BLE TX:", Array.from(data).map(x=>x.toString(16).padStart(2,"0")).join(" "));
  }
}
function getHoldColor(i){const c=h[i].style.getPropertyValue("--c");for(let n=0;n<C.length;n++){if(C[n][1]===c)return n;}return 0;}
async function disconnectBLE(){try{if(bleDevice && bleDevice.gatt.connected){bleDevice.gatt.disconnect();}bleCharacteristic = null;bleService = null;bleServer = null;
document.getElementById("connectPage").style.display = "flex";
document.getElementById("mainPage").style.display = "none";
document.getElementById("connectStatus").textContent ="未接続";}catch(err){console.log(err);}}
const glowBar = document.querySelector(".glow");
const C=[["赤","#ef2939"],["緑","#27c96f"],["青","#2f7df4"],["黄","#ffd43b"],["水","#21c8df"],["桃","#ff4f9a"],["紫","#9933ff"]];
const g=document.getElementById("grid"),modeE=document.getElementById("mode"),selE=document.getElementById("sel"),cntE=document.getElementById("cnt"),hint=document.getElementById("hint");
for(let i=0;i<12;i++){let b=document.createElement("button");b.className="hold";b.dataset.i=i;g.appendChild(b)}
const h=[...document.querySelectorAll(".hold")];
// TASK1の仮初期設定（ホールド番号を0始まりに変換）
// Hold番号: 2,4,1,3,2,4,1,3
const DEFAULT_TASK1 = [1, 3, 0, 2, 1, 3, 0, 2];

const saved = localStorage.getItem("vitalTaskSets");
if (saved) {
  try {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed)) taskSets = parsed;
  } catch (e) {
    console.error("TASK DATA LOAD ERROR:", e);
  }
}

// 保存データの配列を12 TASK分に整える
if (!Array.isArray(taskSets)) taskSets = [];
while (taskSets.length < 12) taskSets.push([]);

// TASK1が未登録の場合だけ初期設定を登録する。
// 既に保存されているTASK1やTASK2～12は上書きしない。
if (!Array.isArray(taskSets[0]) || taskSets[0].length === 0) {
  taskSets[0] = [...DEFAULT_TASK1];
  localStorage.setItem("vitalTaskSets", JSON.stringify(taskSets));
}

h.forEach(btn => {btn.onclick = async () => {let idx = Number(btn.dataset.i);
if(mode==="make"){playClickSound();currentTask[editTurn] = idx;h.forEach((_,i)=>paint(i,null));paint(idx,5);update();return;}
if(mode==="play"){
  // TURNNEXTもBLE送信キューに登録し、LED状態データと重ねない
  await sendLED("TURNNEXT");
  return;
}};});

function paint(i,c){if(c===null){h[i].classList.remove("lit");h[i].style.removeProperty("--c");}else{h[i].classList.add("lit");h[i].style.setProperty("--c",C[c][1]);}}
function all(c){for(let i=0;i<12;i++)paint(i,c);sendLEDState();}
function previewColor(c){for(let i=0;i<12;i++)paint(i,null);paint(5,c);paint(6,c);sendLEDState();}
function halves(){for(let i=0;i<12;i++)paint(i,null);paint(5,left);paint(6,right);sendLEDState();}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function resetPairs(){pairs=[];for(let a=0;a<7;a++)for(let b=a+1;b<7;b++)pairs.push([a,b]);shuffle(pairs);pairNo=0}
function randomDemo(){for(let i=0;i<12;i++)paint(i,null);const ids=Array.from({length:12},(_,i)=>i).sort(()=>Math.random()-0.5);const count=2+Math.floor(Math.random()*5);for(let n=0;n<count;n++)paint(ids[n],Math.floor(Math.random()*7));sendLEDState();}
function playColor(turnNo){if(twoPlay){return turnNo % 2 === 0? left: right;}return one;}
function update(){modeE.textContent=mode==="one"?"1color":mode==="two"?"2color":mode==="demo" ? "Demo" :mode==="select" ? "Select" :mode==="make" ? "Set" :mode==="play"?"Play":"OFF";
if(mode==="play"){selE.textContent = `${play+1}/12`;}else if(mode==="make"){selE.textContent = `${makePos+1}/12`;}else{selE.textContent = "0/12";};
if(mode==="select"||mode==="make"){cntE.textContent=`${editTurn+1}/${currentTask.length}`;}else if(mode==="play"){cntE.textContent=`${playTurn+1}/${playTask.length}`;}else{cntE.textContent=`-`;}

if(!on)hint.textContent="電源を押して開始";
else if(mode==="one")hint.textContent=`1color：${C[one][0]}　△：色変更`;
else if(mode==="two")hint.textContent=`左：${C[left][0]} / 右：${C[right][0]} △：色変更`;
else if(mode==="demo")hint.textContent=`Demo　✅SetTask`;
else if(mode==="select"){let turnCount = "-";if(taskSets[selectedTask] &&taskSets[selectedTask].length > 0){turnCount =taskSets[selectedTask].length;}selE.textContent =`${selectedTask+1}/12`;cntE.textContent =turnCount;hint.textContent =`Task${selectedTask+1}　▷Task選択  ✅開始`;}
else if(mode==="play"){cntE.textContent=`${playTurn+1}/${playTask.length}`;const colorName = playColor(playTurn) !== undefined? C[playColor(playTurn)][0]: "";hint.textContent =`PLAY　${colorName}をタッチ`;}
else if(mode==="make")hint.textContent=`Task${selectedTask+1} ${editTurn+1}/${currentTask.length} Hold選択→▷次△前✅保存`;
else hint.textContent=`Task ${play+1}/12 ▷：次Task`}

document.getElementById("power").onclick=async()=>{
on=!on;
if(on){
  await unlockPhoneAudio();
  playPowerOnSound();
  glowBar.classList.add("powerOn");mode="one";one=0;left=0;right=6;previewColor(0);
}
else{
  playPowerOffSound();
  glowBar.classList.remove("powerOn");clearInterval(demoTimer);demoTimer=null;h.forEach((_,i)=>paint(i,null));
  await sendLED("ALLOFF");mode="off";
}
update();};

document.getElementById("next").onclick=()=>{
if(!on)return;
if(mode==="one"){playClickSound();mode="two";twoPlay=true;resetPairs();[left,right]=pairs.pop();pairNo++;halves();update();return}
if(mode==="two"){playClickSound();mode="demo";randomDemo();demoTimer=setInterval(()=>{if(mode==="demo"){randomDemo();}},1000);update();return}
if(mode==="demo"){playClickSound();clearInterval(demoTimer);demoTimer=null;mode="one";twoPlay=false;one=0;previewColor(one);update();return}
if(mode==="select"){playClickSound();selectedTask=(selectedTask+1)%12;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(playTurn));sendLEDState();update();return;}
if(mode==="make"){if(currentTask[editTurn] === undefined){return;}playClickSound();editTurn++;if(editTurn >= currentTask.length){currentTask.push(undefined);}h.forEach((_,i)=>paint(i,null));if(currentTask[editTurn] !== undefined){paint(currentTask[editTurn],5);}sendLEDState();update();return;}
if(mode==="play"){return;}};

document.getElementById("color").onclick=()=>{if(!on)return;if(mode==="one"){playClickSound();one=(one+1)%7;previewColor(one)}else if(mode==="two"){playClickSound();if(!pairs.length) resetPairs();[left,right] = pairs.pop();pairNo++;halves();};
if(mode==="make"){if(editTurn>0){playClickSound();editTurn--;h.forEach((_,i)=>paint(i,null));paint(currentTask[editTurn],5);sendLEDState();update();}return;}update()};
document.getElementById("ok").onclick=async()=>{if(!on)return;
if(mode==="one"){playClickSound();playReturnMode = "one";selectSource="play";mode="select";selectedTask=0;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="two"){playClickSound();playReturnMode = "two";selectSource="play";mode="select";selectedTask=0;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="demo"){playClickSound();clearInterval(demoTimer);demoTimer=null;selectSource="make";mode="select";selectedTask=0;;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="select"){if(selectSource==="play"){playTask=taskSets[selectedTask].filter(v=>v!==undefined);if(!playTask.length){hint.textContent="データなし";return;}playTurn=0;prevPlayHold=null;mode="play";h.forEach((_,i)=>paint(i,null));paint(playTask[0],playColor(0));await sendLED("PLAY");await sendPlayHold(0);playPlaySound();update();return;}
if(selectSource==="make"){playClickSound();mode="make";currentTask = taskSets[selectedTask]? [...taskSets[selectedTask]]: [];editTurn = 0;h.forEach((_,i)=>paint(i,null));if(currentTask[0]!==undefined){paint(currentTask[0],5);}sendLEDState();update();return;}}
if(mode==="make"){playClickSound();taskSets[selectedTask] = currentTask.filter(v => v !== undefined);localStorage.setItem("vitalTaskSets",JSON.stringify(taskSets));mode="demo";randomDemo();demoTimer=setInterval(()=>{if(mode==="demo"){randomDemo();}},1000);update();return;}
};

update();
</script></body></html>
